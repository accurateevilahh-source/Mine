name: Android ARM64 engine build

on:
  workflow_dispatch:
  push:
    branches:
      - android-engine-recovery
    paths:
      - "patches/**"
      - ".github/workflows/android-arm64-engine.yml"

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Mine
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            ndk;27.2.12479018

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv ninja-build pkg-config file
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install "meson==1.7.2"
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/meson-venv/bin:$PATH"
          meson --version

      - name: Check out Portable LCE
        run: |
          git clone https://github.com/portable-lce/portable-lce.git upstream
          git -C upstream checkout 550cd6511b5f48e25e2860863e33bcf09ce8a363

      - name: Validate and apply Android recovery patches
        run: |
          git -C upstream apply --recount --check "$GITHUB_WORKSPACE/patches/portable-lce-android-recovery.patch"
          git -C upstream apply --recount --check "$GITHUB_WORKSPACE/patches/portable-lce-android-egl-renderer.patch"
          git -C upstream apply --recount "$GITHUB_WORKSPACE/patches/portable-lce-android-recovery.patch"
          git -C upstream apply --recount "$GITHUB_WORKSPACE/patches/portable-lce-android-egl-renderer.patch"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("upstream")
          def replace(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(s.replace(old, new, 1))
          replace("targets/platform/renderer/gl/gl3_loader.h",
              "#include <GL/glew.h>",
              "#ifdef __ANDROID__\n#include <GLES3/gl3.h>\n#else\n#include <GL/glew.h>\n#endif")
          replace("targets/platform/renderer/gl/gl3_loader.h",
              "static inline bool gl3_load() {\n    GLenum err = glewInit();",
              "static inline bool gl3_load() {\n#ifdef __ANDROID__\n    return true; // GLES entry points are supplied by the Android NDK.\n#else\n    GLenum err = glewInit();")
          replace("targets/platform/renderer/gl/gl3_loader.h",
              "            (const char*)glewGetString(GLEW_VERSION));\n    return true;\n}",
              "            (const char*)glewGetString(GLEW_VERSION));\n    return true;\n#endif\n}")
          replace("targets/platform/renderer/gl/gl_compat.h",
              "#include <GL/glew.h>",
              "#ifdef __ANDROID__\n#include <GLES3/gl3.h>\n#else\n#include <GL/glew.h>\n#endif")
          replace("targets/app/common/Iggy/gdraw/gdraw.c",
              "#if defined(__APPLE__) || defined (__linux__)\n#include \"SDL_opengl.h\"",
              "#if defined(__APPLE__) || defined (__linux__) || defined(__ANDROID__)\n#if defined(__ANDROID__)\n#include \"SDL_opengles2.h\"\n#else\n#include \"SDL_opengl.h\"\n#endif")
          replace("targets/platform/stubs.h",
              "#include \"renderer/gl/gl_compat.h\"",
              """#include \"renderer/gl/gl_compat.h\"\n\n#ifdef __ANDROID__\n#ifndef GL_COLOR_MATERIAL\n#define GL_COLOR_MATERIAL 0x0B57\n#endif\n#ifndef GL_AMBIENT_AND_DIFFUSE\n#define GL_AMBIENT_AND_DIFFUSE 0x1602\n#endif\n#ifndef GL_POLYGON_OFFSET_LINE
              #define GL_POLYGON_OFFSET_LINE 0x2A02
              #endif
              // GLES has no fixed-function normal, material, depth-clear, or shade-model calls.
              #define glNormal3f(x, y, z) ((void)0)
              #define glColorMaterial(face, mode) ((void)0)\n#define glClearDepth glClearDepthf\n#ifdef glShadeModel\n#undef glShadeModel\n#endif\n#define glShadeModel(mode) ((void)0)\n#endif""")
          replace("targets/platform/stubs.h",
              "    static void glShadeModel(int mode) { ::glShadeModel(mode); }",
              """#ifdef __ANDROID__\n    static void glShadeModel(int) {}\n#else\n    static void glShadeModel(int mode) { ::glShadeModel(mode); }\n#endif""")
          replace("targets/minecraft/client/Lighting.cpp",
              "    glColorMaterial(GL_FRONT_AND_BACK, GL_AMBIENT_AND_DIFFUSE);",
              "    // GLES does not expose fixed-function glColorMaterial.")
          replace("targets/minecraft/client/Lighting.cpp",
              "    glShadeModel(GL_FLAT);",
              "    // GLES does not expose fixed-function glShadeModel.")
          replace("targets/minecraft/client/Minecraft.cpp",
              "    glShadeModel(GL_SMOOTH);",
              "    // GLES does not expose fixed-function glShadeModel.")
          replace("targets/platform/stubs.h",
              "#undef GL_ARRAY_BUFFER_ARB",
              """#ifdef __ANDROID__
          // Disable legacy fixed-function shade model calls after GL11's
          // compatibility wrapper has been declared.
          #define glShadeModel(mode) ((void)0)
          #endif
          #undef GL_ARRAY_BUFFER_ARB""")
          import re
          def replace_regex(path, pattern, replacement):
              p = root / path
              s = p.read_text()
              updated, count = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}")
              p.write_text(updated)
          replace_regex("targets/minecraft/client/multiplayer/MultiPlayerChunkCache.cpp",
              r"if\s*\(\s*std::atomic_ref<LevelChunk\*>\(cache\[idx\]\)\s*\.compare_exchange_strong\(expected,\s*chunk,\s*std::memory_order_release\)\s*\)",
              "if (__atomic_compare_exchange_n(&cache[idx], &expected, chunk, false, __ATOMIC_RELEASE, __ATOMIC_RELAXED))")
          replace("targets/platform/renderer/gl/GLRenderer.cpp",
              "#include \"platform/renderer/renderer.h\"",
              """#include \"platform/renderer/renderer.h\"\n\n#ifdef __ANDROID__\n// Legacy fixed-function enum values used only as internal state identifiers.\n#ifndef GL_PROJECTION\n#define GL_PROJECTION 0x1701\n#endif\n#ifndef GL_MODELVIEW_MATRIX\n#define GL_MODELVIEW_MATRIX 0x0BA6\n#endif\n#ifndef GL_PROJECTION_MATRIX\n#define GL_PROJECTION_MATRIX 0x0BA7\n#endif\n#ifndef GL_EXP\n#define GL_EXP 0x0800\n#endif\n#endif""")
          PY

      - name: Create Android ARM64 Meson cross file
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > "$GITHUB_WORKSPACE/android-aarch64.ini" <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android24-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android24-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          ranlib = '$TOOLCHAIN/llvm-ranlib'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

      - name: Configure ARM64 GLES build
        working-directory: upstream
        run: |
          export PATH="$RUNNER_TEMP/meson-venv/bin:$PATH"
          meson setup build-android \
            --cross-file "$GITHUB_WORKSPACE/android-aarch64.ini" \
            --wrap-mode=forcefallback \
            -Dbuildtype=debug \
            -Dunity=off \
            -Ddefault_library=static \
            -Drenderer=gles \
            -Dui_backend=java \
            -Denable_mimalloc=disabled

      - name: Compile native engine
        working-directory: upstream
        run: |
          export PATH="$RUNNER_TEMP/meson-venv/bin:$PATH"
          meson compile -C build-android -v

      - name: Verify ARM64 shared library
        working-directory: upstream
        run: |
          set -euo pipefail
          LIB="$(find build-android -type f -name 'libMinecraftClient.so' -print -quit)"
          test -n "$LIB"
          file "$LIB"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$LIB" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$LIB" "$GITHUB_WORKSPACE/dist/libMinecraftClient.so"

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-engine-android-arm64
          path: dist/libMinecraftClient.so
          if-no-files-found: error

  build-apk:
    name: Package Android APK
    needs: build-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out 4JCraft Android launcher
        uses: actions/checkout@v4
        with:
          repository: ItzVladik/4jcraft-laucnher
          ref: 598f666c2144153f74465c9a24ddc50ad7b65b6b
          path: launcher

      - name: Install Android SDK platform and build tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download ARM64 engine library
        uses: actions/download-artifact@v4
        with:
          name: minecraft-engine-android-arm64
          path: engine-artifact

      - name: Integrate engine and align launcher SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s engine-artifact/libMinecraftClient.so
          mkdir -p launcher/android/lib/arm64-v8a
          cp engine-artifact/libMinecraftClient.so launcher/android/lib/arm64-v8a/libMinecraftClient.so
          python3 - <<'PY'
          from pathlib import Path
          p = Path("launcher/android/wscript")
          s = p.read_text()
          if "target_api=29" not in s:
              raise SystemExit("Expected launcher target_api=29 setting was not found")
          p.write_text(s.replace("target_api=29", "target_api=34", 1))
          PY
          for lib in libSDL2.so libc++_shared.so libcrypto.so; do
            test -s "launcher/android/lib/arm64-v8a/$lib"
          done

      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          cd launcher
          python3 waf configure -T debug
          python3 waf build
          APK="build/android/mod-signed.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Minecraft-LCE-Android-arm64-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-lce-android-arm64-debug-apk
          path: dist/Minecraft-LCE-Android-arm64-debug.apk
          if-no-files-found: error